<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava Pollard - Live LTA 10U Tournament Matchup Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                    <i class="fas fa-radar text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight">Live LTA 10U Matchup Engine</h1>
                    <p class="text-xs text-slate-400">Target Player: <span class="text-blue-400 font-semibold">Ava Pollard (Kent 2017)</span></p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Live Backend Connection Badge -->
                <div id="connectionBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="connectionText">Authenticating Token...</span>
                </div>
                
                <button onclick="fetchLiveLTAData()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition flex items-center gap-2 shadow-sm">
                    <i class="fas fa-sync-alt"></i> Refresh Live
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Private & Security Status Banner -->
        <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-xs sm:text-sm text-emerald-900 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <i class="fas fa-shield-halved text-emerald-600 text-lg"></i>
                <div>
                    <span class="font-bold">Secured Private App:</span>
                    <span class="text-emerald-700"> Live LTA query token active. External unauthorized access is blocked.</span>
                </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-200/60 text-emerald-800 font-bold text-[11px] rounded-md uppercase">Private</span>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-4 mb-6 shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Origin Postcode</label>
                    <input type="text" id="postcode" value="CT2 7LN" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm font-semibold bg-slate-50" readonly>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Max Travel Distance</label>
                    <select id="radiusFilter" onchange="fetchLiveLTAData()" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 bg-white">
                        <option value="30">30 miles</option>
                        <option value="50">50 miles</option>
                        <option value="100" selected>100 miles</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Grade Level</label>
                    <select id="gradeFilter" onchange="renderTournaments()" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 bg-white">
                        <option value="ALL">All Grades (G3 & G4)</option>
                        <option value="3">Grade 3 Only (Regional)</option>
                        <option value="4">Grade 4 Only (County)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Sort Preference</label>
                    <select id="sortFilter" onchange="renderTournaments()" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 bg-white">
                        <option value="RECOMMENDED">Best Recommendation for Ava</option>
                        <option value="DISTANCE">Nearest Distance</option>
                        <option value="DATE">Soonest Start Date</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="tournamentContainer" class="space-y-4">
            <div class="p-8 text-center text-slate-500 bg-white rounded-xl border border-slate-200">
                <i class="fas fa-spinner fa-spin text-2xl text-blue-600 mb-2"></i>
                <p class="text-sm">Connecting securely to Render cloud backend...</p>
            </div>
        </div>
    </main>

    <script>
        // REPLACE THIS URL WITH YOUR RENDER CLOUD URL ONCE DEPLOYED:
        const CLOUD_API_URL = "https://ava-lta-scraper.onrender.com/api/live-tournaments";
        
        // MATCHING SECRET ACCESS TOKEN
        const SECRET_KEY = "AGP2026!";

        let rawTournaments = [];

        async function fetchLiveLTAData() {
            const badge = document.getElementById('connectionBadge');
            const statusText = document.getElementById('connectionText');
            const radius = document.getElementById('radiusFilter').value;

            try {
                const response = await fetch(`${CLOUD_API_URL}?postcode=CT27LN&radius=${radius}`, {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "x-app-token": SECRET_KEY
                    }
                });

                if (response.status === 403) {
                    throw new Error("Access Denied: Secret Key Mismatch");
                }
                
                if (!response.ok) throw new Error("Cloud Scraper Offline");

                const data = await response.json();
                rawTournaments = data.tournaments || [];

                badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                statusText.textContent = `Live Verified (${rawTournaments.length} Events)`;

                renderTournaments();
            } catch (err) {
                badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                statusText.textContent = err.message || "Connection Error";

                document.getElementById('tournamentContainer').innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-red-200 text-center">
                        <i class="fas fa-lock text-3xl text-red-500 mb-3"></i>
                        <h3 class="font-bold text-slate-800 text-base mb-1">Secure Connection Pending</h3>
                        <p class="text-xs text-slate-500 max-w-md mx-auto mb-4">
                            Deploy your server to Render and ensure the secret header matches <code>SECRET_API_KEY</code>.
                        </p>
                    </div>
                `;
            }
        }

        function renderTournaments() {
            const container = document.getElementById('tournamentContainer');
            const gradeFilter = document.getElementById('gradeFilter').value;

            let filtered = rawTournaments.filter(t => {
                if (gradeFilter !== 'ALL' && t.grade.toString() !== gradeFilter) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-500 text-sm">
                        No open 10U G3/G4 tournaments match your distance criteria right now.
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(t => `
                <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:border-slate-300 transition">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 ${t.grade === 3 ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} font-bold text-xs rounded">Grade ${t.grade}</span>
                                <span class="px-2 py-0.5 bg-slate-100 text-slate-700 font-mono text-xs rounded">${t.code}</span>
                                <h3 class="font-bold text-slate-900 text-base">${t.name}</h3>
                            </div>
                            <p class="text-xs text-slate-500 flex items-center gap-3 mt-1">
                                <span><i class="fas fa-map-marker-alt me-1 text-slate-400"></i>${t.venue} (~${t.distance} mi)</span>
                                <span><i class="fas fa-calendar me-1 text-slate-400"></i>${t.dates}</span>
                            </p>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            <a href="${t.link}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs rounded-lg transition flex items-center gap-1.5 shadow-sm">
                                Open Official LTA Page <i class="fas fa-external-link-alt text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = function() {
            fetchLiveLTAData();
        };
    </script>
</body>
</html>
