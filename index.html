<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ava LTA Radar</title>
<style>
:root {
--primary: #10b981;
--primary-dark: #059669;
--bg: #0f172a;
--card-bg: #1e293b;
--text: #f8fafc;
--text-muted: #94a3b8;
--border: #334155;
--accent: #3b82f6;
--warning: #f59e0b;
--danger: #ef4444;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: var(--bg);
color: var(--text);
padding: 16px;
padding-bottom: 40px;
max-width: 600px;
margin: 0 auto;
}

/* PIN LOCK OVERLAY */
#pin-overlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: var(--bg);
z-index: 9999;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
text-align: center;
}

.pin-box {
background: var(--card-bg);
border: 1px solid var(--border);
padding: 30px 24px;
border-radius: 20px;
width: 100%;
max-width: 320px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.pin-title {
font-size: 1.25rem;
font-weight: 700;
margin-bottom: 8px;
}

.pin-sub {
font-size: 0.85rem;
color: var(--text-muted);
margin-bottom: 20px;
}

.pin-input {
width: 100%;
padding: 12px;
font-size: 1.5rem;
letter-spacing: 8px;
text-align: center;
background: #090d16;
border: 1px solid var(--border);
color: var(--primary);
border-radius: 12px;
margin-bottom: 16px;
outline: none;
}

.pin-input:focus {
border-color: var(--primary);
}

.pin-btn {
width: 100%;
padding: 12px;
background: var(--primary);
color: #000;
font-weight: 700;
border: none;
border-radius: 12px;
font-size: 1rem;
cursor: pointer;
}

.pin-error {
color: var(--danger);
font-size: 0.8rem;
margin-top: 10px;
display: none;
}

/* MAIN APP LAYOUT */
#app-content {
display: none;
}

header {
margin-bottom: 20px;
padding-top: 10px;
display: flex;
justify-content: space-between;
align-items: flex-start;
}

.header-left {
flex: 1;
}

.badge {
background: rgba(16, 185, 129, 0.15);
color: var(--primary);
padding: 4px 10px;
border-radius: 12px;
font-size: 0.75rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.5px;
display: inline-block;
margin-bottom: 8px;
border: 1px solid rgba(16, 185, 129, 0.3);
}

h1 {
font-size: 1.5rem;
font-weight: 700;
}

.subtitle {
color: var(--text-muted);
font-size: 0.875rem;
margin-top: 4px;
}

.lock-icon-btn {
background: var(--card-bg);
border: 1px solid var(--border);
color: var(--text-muted);
padding: 8px 12px;
border-radius: 10px;
font-size: 0.8rem;
cursor: pointer;
}

.status-card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 16px;
padding: 16px;
margin-bottom: 20px;
display: flex;
align-items: center;
justify-content: space-between;
}

.status-indicator {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.875rem;
font-weight: 500;
}

.dot {
width: 10px;
height: 10px;
border-radius: 50%;
background-color: var(--primary);
box-shadow: 0 0 8px var(--primary);
}

.refresh-btn {
background: var(--accent);
color: white;
border: none;
padding: 8px 14px;
border-radius: 10px;
font-weight: 600;
font-size: 0.8rem;
cursor: pointer;
}

.section-title {
font-size: 1.1rem;
font-weight: 600;
margin-bottom: 12px;
display: flex;
align-items: center;
justify-content: space-between;
}

.tournament-card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 16px;
padding: 16px;
margin-bottom: 16px;
position: relative;
}

.grade-badge {
position: absolute;
top: 16px;
right: 16px;
padding: 4px 8px;
border-radius: 8px;
font-size: 0.75rem;
font-weight: 700;
}

.g3 { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
.g4 { background: rgba(59, 130, 246, 0.2); color: var(--accent); border: 1px solid var(--accent); }

.t-title {
font-size: 1.05rem;
font-weight: 600;
padding-right: 50px;
margin-bottom: 6px;
}

.t-info {
font-size: 0.85rem;
color: var(--text-muted);
margin-bottom: 4px;
}

.t-actions {
margin-top: 14px;
display: flex;
gap: 8px;
}

.btn {
flex: 1;
text-align: center;
padding: 10px;
border-radius: 10px;
text-decoration: none;
font-size: 0.85rem;
font-weight: 600;
}

.btn-primary {
background: var(--primary);
color: #000;
}

.loader {
text-align: center;
padding: 40px;
color: var(--text-muted);
font-size: 0.9rem;
}
</style>
</head>
<body>

<!-- PIN LOCK OVERLAY -->
<div id="pin-overlay">
<div class="pin-box">
<div class="pin-title">🔒 Private Access</div>
<div class="pin-sub">Enter PIN to access Ava LTA Radar</div>
<input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" pattern="[0-9]*" inputmode="numeric">
<button class="pin-btn" onclick="verifyPin()">Unlock App</button>
<div id="pin-error" class="pin-error">Incorrect PIN. Try again.</div>
</div>
</div>

<!-- MAIN DASHBOARD CONTENT -->
<div id="app-content">
<header>
<div class="header-left">
<span class="badge">Ava Pollard • 10U Radar</span>
<h1>LTA Tournament Finder</h1>
<p class="subtitle">Live analysis for 100mi radius from CT2 7LN</p>
</div>
<button class="lock-icon-btn" onclick="lockApp()">🔒 Lock</button>
</header>

<div class="status-card">
<div class="status-indicator">
<div class="dot"></div>
<span>Connected to Render API</span>
</div>
<button class="refresh-btn" onclick="fetchTournaments()">Refresh Live</button>
</div>

<div class="section-title">
<span>Upcoming Tournaments</span>
</div>

<div id="tournament-container">
<div class="loader">Loading live LTA tournament feed...</div>
</div>
</div>

<script>
const RENDER_API_URL = "https://ava-lta-scraper.onrender.com/api/live-tournaments";
const SECRET_KEY = "AGP2026!";
const APP_PIN = "2026"; // Set your 4-digit PIN here

function checkAuth() {
if (localStorage.getItem('ava_app_unlocked') === 'true') {
document.getElementById('pin-overlay').style.display = 'none';
document.getElementById('app-content').style.display = 'block';
fetchTournaments();
} else {
document.getElementById('pin-overlay').style.display = 'flex';
document.getElementById('app-content').style.display = 'none';
}
}

function verifyPin() {
const entered = document.getElementById('pin-input').value;
const errDiv = document.getElementById('pin-error');

if (entered === APP_PIN) {
localStorage.setItem('ava_app_unlocked', 'true');
errDiv.style.display = 'none';
checkAuth();
} else {
errDiv.style.display = 'block';
document.getElementById('pin-input').value = '';
}
}

function lockApp() {
localStorage.removeItem('ava_app_unlocked');
document.getElementById('pin-input').value = '';
checkAuth();
}

// Allow pressing Enter key on PIN input
document.getElementById('pin-input').addEventListener('keyup', function(e) {
if (e.key === 'Enter') {
verifyPin();
}
});

async function fetchTournaments() {
const container = document.getElementById('tournament-container');
container.innerHTML = '<div class="loader">Fetching live LTA entries...</div>';

try {
const response = await fetch(RENDER_API_URL, {
headers: {
'X-App-Token': SECRET_KEY
}
});

if (!response.ok) {
throw new Error(`Server returned status: ${response.status}`);
}

const tournaments = await response.json();
renderTournaments(tournaments);
} catch (err) {
container.innerHTML = `
<div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 16px; border-radius: 12px; color: #fca5a5;">
<strong>Connection Error:</strong><br>
${err.message}<br><br>
<small>Check that your Render server is live and that environment variable APP_SECRET_KEY is set to AGP2026!</small>
</div>
`;
}
}

function renderTournaments(tournaments) {
const container = document.getElementById('tournament-container');
if (!tournaments || tournaments.length === 0) {
container.innerHTML = '<div class="loader">No open 10U G3/G4 tournaments match your distance criteria right now.</div>';
return;
}

container.innerHTML = tournaments.map(t => `
<div class="tournament-card">
<span class="grade-badge ${t.grade ? t.grade.toLowerCase() : 'g4'}">${t.grade || 'G4'}</span>
<div class="t-title">${t.name}</div>
<div class="t-info">📍 ${t.location} (${t.distanceMiles} mi)</div>
<div class="t-info">📅 ${t.startDate}</div>
<div class="t-info">👥 Entrants: ${t.entrantsCount || 0} players</div>

<div class="t-actions">
<a href="${t.ltaUrl}" target="_blank" class="btn btn-primary">View on LTA</a>
</div>
</div>
`).join('');
}

// Check PIN on load
checkAuth();
</script>
</body>
</html>
